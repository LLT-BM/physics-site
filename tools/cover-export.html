<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Экспорт обложки 1200×630</title>
<style>body{background:#0d1626;color:#eaf3fa;font:15px system-ui;padding:20px;max-width:1000px;margin:0 auto}
textarea{width:100%;height:200px;background:#05080f;color:#eaf3fa;border:1px solid #2a3a52;border-radius:8px;padding:10px;font:12px monospace}
canvas{width:100%;max-width:600px;background:#05080f;border:1px solid #2a3a52;border-radius:8px;margin-top:12px}
button,select,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #2a3a52;background:#132033;color:#eaf3fa;margin:6px 6px 0 0}
button{background:#5fe0ff;color:#07121c;font-weight:600;cursor:pointer}</style></head><body>
<h2>Экспорт обложки → PNG 1200×630</h2>
<p>Вставьте содержимое .svg файла целиком (от &lt;svg до &lt;/svg&gt;).</p>
<textarea id="src" placeholder="&lt;svg xmlns=..."></textarea>
<div>Режим:
<select id="mode"><option value="fit">вписать с полями (ничего не теряется)</option><option value="cover">заполнить с обрезкой</option></select>
Фон: <input type="color" id="bg" value="#070f1d">
<input type="text" id="name" value="cover" style="width:120px">
<button id="go">Скачать PNG</button></div>
<canvas id="cv" width="1200" height="630"></canvas>
<script>
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
function render(cb){
  var s=document.getElementById('src').value.trim(); if(!s) return;
  var m=s.match(/viewBox\s*=\s*"([\d.\-\s]+)"/), vb=m?m[1].split(/\s+/).map(Number):[0,0,1200,750];
  var vw=vb[2],vh=vb[3];
  var blob=new Blob([s],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob), img=new Image();
  img.onload=function(){
    cx.fillStyle=document.getElementById('bg').value; cx.fillRect(0,0,1200,630);
    var k=document.getElementById('mode').value==='cover'?Math.max(1200/vw,630/vh):Math.min(1200/vw,630/vh);
    var w=vw*k,h=vh*k; cx.drawImage(img,(1200-w)/2,(630-h)/2,w,h);
    URL.revokeObjectURL(url); cb&&cb();
  };
  img.onerror=function(){ alert('Не удалось разобрать SVG. Проверьте, что вставлен весь тег svg.'); };
  img.src=url;
}
document.getElementById('src').addEventListener('input',function(){render()});
document.getElementById('mode').addEventListener('change',function(){render()});
document.getElementById('bg').addEventListener('input',function(){render()});
document.getElementById('go').addEventListener('click',function(){
  render(function(){ var a=document.createElement('a');
    a.download=(document.getElementById('name').value||'cover')+'.png';
    a.href=cv.toDataURL('image/png'); a.click(); });
});
</script></body></html>
