<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1930"/><stop offset=".55" stop-color="#070f1d"/><stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#78beff" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5fe0ff"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  
  <!-- Wires -->
  <g fill="none" stroke="#5fe0ff" stroke-width="4">
    <path d="M250 250 L 850 250 L 850 500 L 250 500 Z"/>
  </g>
  
  <!-- Battery -->
  <g transform="translate(250, 375)">
    <rect x="-20" y="-40" width="40" height="80" fill="#0d1626"/>
    <path d="M-30 -15 L 30 -15" stroke="#5fe0ff" stroke-width="4"/>
    <path d="M-40 15 L 40 15" stroke="#5fe0ff" stroke-width="6"/>
    <text x="-55" y="-10" fill="#8ba3b8" font-size="20" text-anchor="end">−</text>
    <text x="-55" y="22" fill="#8ba3b8" font-size="20" text-anchor="end">+</text>
    <text x="55" y="-5" fill="#ffb454" font-size="22" font-family="Unbounded, sans-serif" font-weight="600">ℰ, r</text>
  </g>

  <!-- Resistor (glowing) -->
  <g transform="translate(550, 250)" filter="url(#glow)">
    <rect x="-40" y="-20" width="80" height="40" fill="#0d1626"/>
    <path d="M-40 0 L -25 -15 L -10 15 L 5 -15 L 20 15 L 40 0" fill="none" stroke="#ffb454" stroke-width="5"/>
    <text x="0" y="-35" fill="#ffb454" font-size="22" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="600">R</text>
  </g>

  <!-- Ammeter -->
  <g transform="translate(550, 500)">
    <circle cx="0" cy="0" r="45" fill="#0d1626" stroke="#5fe0ff" stroke-width="3"/>
    <text x="0" y="-10" fill="#5fe0ff" font-size="28" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800">A</text>
    <path d="M0 0 L 25 -25" stroke="#ffb454" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#ffb454"/>
  </g>

  <!-- Voltmeter -->
  <g transform="translate(850, 375)">
    <circle cx="0" cy="0" r="45" fill="#0d1626" stroke="#ffb454" stroke-width="3"/>
    <text x="0" y="-10" fill="#ffb454" font-size="28" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800">V</text>
    <path d="M0 0 L 20 -30" stroke="#5fe0ff" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#5fe0ff"/>
  </g>

  <!-- Electrons -->
  <g fill="#eafcff" filter="url(#glow)">
    <circle cx="350" cy="250" r="5"/><circle cx="450" cy="250" r="5"/>
    <circle cx="650" cy="250" r="5"/><circle cx="750" cy="250" r="5"/>
    <circle cx="850" cy="300" r="5"/><circle cx="850" cy="400" r="5"/>
    <circle cx="750" cy="500" r="5"/><circle cx="650" cy="500" r="5"/>
    <circle cx="450" cy="500" r="5"/><circle cx="350" cy="500" r="5"/>
    <circle cx="250" cy="450" r="5"/><circle cx="250" cy="300" r="5"/>
  </g>

  <!-- Formulas & Labels -->
  <text x="48" y="64" fill="#ffb454" font-size="20" letter-spacing="6">LIBLABTAB · 04</text>
  <text x="48" y="94" fill="#8ba3b8" font-size="16" letter-spacing="3">ЭЛЕКТРОДИНАМИКА · I = ℰ / (R + r)</text>
  
  <g stroke="#78beff" stroke-opacity=".3" fill="none">
    <path d="M20 44V20h24"/><path d="M1156 20h24v24"/><path d="M1180 706v24h-24"/><path d="M44 730H20v-24"/>
  </g>
  <rect width="1200" height="750" fill="url(#vig)"/>
</svg>